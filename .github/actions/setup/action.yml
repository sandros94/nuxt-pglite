name: Setup
description: Set up pnpm + Node, install dependencies and prepare the development build

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24.17.0
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Prepare development build
      run: pnpm dev:prepare
      shell: bash
