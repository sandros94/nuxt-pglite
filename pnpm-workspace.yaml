packages:
  - docs
  - 'playgrounds/*'
  - test/fixtures/*

catalog:
  '@electric-sql/pglite': npm:@electric-sql/pglite@^0.5.13
  "@electric-sql/pglite-pgvector": npm:@electric-sql/pglite-pgvector@^0.0.14
  "@types/pg": npm:@types/pg@^8.23.1
  drizzle-kit: npm:drizzle-kit@1.0.0-rc.5
  drizzle-orm: npm:drizzle-orm@1.0.0-rc.5
  nuxt: npm:nuxt@^4.6.0
  pg: npm:pg@^8.23.1
  vue: npm:vue@^3.5.43

overrides:
  # docs: 2.2.0's `strong` handler recurses forever under remark-mdc 3.11
  # (every `**bold**`), which breaks the llms-full.txt prerender.
  mdast-util-to-markdown: 2.1.2

minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - 'nitro'
  - 'nuxt'
  - '@nuxt/*'

allowBuilds:
  '@parcel/watcher': false
  'better-sqlite3': true
  cpu-features: false
  esbuild: false
  protobufjs: false
  'sharp@0.34.5': true
  simple-git-hooks: true
  ssh2: false
  vue-demi: false
