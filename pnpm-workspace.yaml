packages:
  - docs
  - playground
  - test/fixtures/*

catalog:
  nuxt: npm:nuxt@^4.6.0
  vue: npm:vue@^3.5.43

overrides:
  # docs: 2.2.0's `strong` handler recurses forever under remark-mdc 3.11
  # (every `**bold**`), which breaks the llms-full.txt prerender.
  mdast-util-to-markdown: 2.1.2

minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - 'nuxt'
  - '@nuxt/*'

allowBuilds:
  '@parcel/watcher': false
  'better-sqlite3': true
  cpu-features: false
  esbuild: false
  protobufjs: false
  'sharp@0.34.5': true
  simple-git-hooks: true
  ssh2: false
  vue-demi: false
